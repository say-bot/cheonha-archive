<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천하지도 · 잠금</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1417;
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;color:#ece6d6;
    background-image:radial-gradient(120% 80% at 80% -10%,rgba(111,194,164,.10),transparent 60%),
      radial-gradient(90% 60% at -5% 5%,rgba(221,86,72,.07),transparent 55%);}
  .card{width:min(90vw,380px);padding:34px 30px 26px;border:1px solid #294048;border-radius:18px;
    background:rgba(20,36,43,.85);box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center;
    visibility:hidden;}
  .card.show{visibility:visible;}
  .seal{width:54px;height:54px;margin:0 auto 16px;display:grid;place-items:center;font-size:24px;
    border:1px solid #2f6151;border-radius:13px;background:#16302b;}
  h1{margin:0 0 6px;font-family:"Nanum Myeongjo","AppleMyungjo",Batang,serif;font-size:22px;letter-spacing:-.01em;}
  p{margin:0 0 20px;color:#94a6a6;font-size:13px;letter-spacing:.02em;}
  form{display:flex;gap:8px;}
  input{flex:1;min-width:0;padding:11px 13px;border:1px solid #294048;border-radius:10px;background:#0f1719;
    color:#ece6d6;font-size:15px;outline:none;}
  input:focus{border-color:#6fc2a4;box-shadow:0 0 0 3px rgba(111,194,164,.15);}
  button{padding:11px 16px;border:1px solid #2f6151;border-radius:10px;background:#16302b;color:#6fc2a4;
    font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
  button:hover{background:#1c3b34;}
  .err{margin-top:14px;min-height:18px;font-size:12.5px;color:#dd5648;letter-spacing:.02em;}
  .foot{margin-top:12px;font-size:11px;color:#5c7073;letter-spacing:.04em;line-height:1.7;}
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <div class="seal">🔒</div>
    <h1>천하지도</h1>
    <p>낙월 동맹 전용 · 암호를 입력하세요</p>
    <form id="f">
      <input id="pw" type="password" autocomplete="current-password" placeholder="암호" autofocus>
      <button type="submit">열기</button>
    </form>
    <div class="err" id="err"></div>
    <div class="foot">한 번 열면 이 기기에서 24시간 동안 자동으로 열립니다.<br>
      다시 잠그려면 주소 끝에 <b>#lock</b> 을 붙여 여세요.</div>
  </div>
</main>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var KEY="nslg_worldmap_gate_v1", TTL=24*3600*1000;
  var card=document.getElementById('card'), f=document.getElementById('f'),
      pw=document.getElementById('pw'), err=document.getElementById('err'),
      btn=f.querySelector('button');
  var b64d=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};

  function store(v){ try{ v===null ? localStorage.removeItem(KEY)
                                   : localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
  function saved(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY)||'null');
      if(s && s.pw && s.exp>Date.now()) return s.pw;
      if(s) store(null);
    }catch(e){}
    return null;
  }
  function open_(html){ document.open(); document.write(html); document.close(); }
  function decrypt(pass){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:b64d(P.salt),iterations:P.it,hash:'SHA-256'},
          km,{name:'AES-GCM',length:256},false,['decrypt']);
      })
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(P.iv)},k,b64d(P.ct)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function showForm(){ card.classList.add('show'); try{ pw.focus(); }catch(e){} }

  /* #lock 이면 저장된 자동 해제를 지운다 */
  if((location.hash||'').toLowerCase().indexOf('lock')>=0){
    store(null);
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }

  var auto=saved();
  if(auto){
    decrypt(auto).then(function(html){
      store({pw:auto, exp:Date.now()+TTL});   /* 볼 때마다 기한 연장 */
      open_(html);
    }).catch(function(){ store(null); showForm(); });
  } else showForm();

  f.addEventListener('submit',function(e){
    e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='여는 중…';
    var pass=pw.value;
    decrypt(pass).then(function(html){
      store({pw:pass, exp:Date.now()+TTL});
      open_(html);
    }).catch(function(){
      err.textContent='암호가 올바르지 않습니다.';
      btn.disabled=false; btn.textContent='열기'; pw.select();
    });
  });
})();
</script>
