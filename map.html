<style>

    return true;
  }
  function matched(n){ return query && norm(n.n).indexOf(query)>=0; }
  function sx(x){ return view.tx + x*view.s; }

  var img=new Image();
  img.onload=function(){
    terrainCv=document.createElement('canvas');
    terrainCv.width=MW; terrainCv.height=MH;
    var tc=terrainCv.getContext('2d',{willReadFrequently:true});
    tc.imageSmoothingEnabled=false;
    tc.save(); tc.translate(0,MH); tc.scale(1,-1); tc.drawImage(img,0,0); tc.restore();
    var c2k={};
    Object.keys(T.palette).forEach(function(k){ c2k[parseInt(T.palette[k].slice(1),16)]=+k; });
    codeAt=function(x,y){
      if(x<0||y<0||x>=MW||y>=MH) return null;
      var d=tc.getImageData(x,MH-1-y,1,1).data;
      return c2k[(d[0]<<16)|(d[1]<<8)|d[2]];
    };
    ready=true; fit();
  };
  img.src=T.png;

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var w=window.innerWidth, h=window.innerHeight;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    cv.style.width=w+'px'; cv.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return {width:w,height:h};
  }
  function draw(){
    if(!ready) return;
    var w=window.innerWidth, h=window.innerHeight;
    ctx.imageSmoothingEnabled=false;
    ctx.fillStyle='#0b1215'; ctx.fillRect(0,0,w,h);
    ctx.drawImage(terrainCv, view.tx, view.ty, MW*view.s, MH*view.s);
    var z=view.s, shown=0;
    D.nodes.forEach(function(n){
      if(!visible(n)) return;
      shown++;
      var hit=matched(n), dim=query&&!hit;
      var X=sx(n.x)+z/2, Y=sy(n.y)+z/2;
      if(X<-30||Y<-30||X>w+30||Y>h+30) return;
      var s=KSIZE[n.k]*(z<0.35?0.85:1)*(hit?1.5:1);
      ctx.globalAlpha=dim?0.3:1;
      ctx.beginPath();
      var sh=KSHAPE[n.k];
      if(sh==='sq'){ ctx.moveTo(X,Y-s); ctx.lineTo(X+s,Y); ctx.lineTo(X,Y+s); ctx.lineTo(X-s,Y); ctx.closePath(); }
      else if(sh==='tri'){ ctx.moveTo(X,Y-s); ctx.lineTo(X+s,Y+s); ctx.lineTo(X-s,Y+s); ctx.closePath(); }
      else if(sh==='star'){
        for(var a=0;a<10;a++){
          var rr=a%2?s*0.45:s, th=-Math.PI/2+a*Math.PI/5;
          var px=X+rr*Math.cos(th), py=Y+rr*Math.sin(th);
          a?ctx.lineTo(px,py):ctx.moveTo(px,py);
        }
        ctx.closePath();
      } else ctx.arc(X,Y,s,0,6.2832);
      ctx.fillStyle = n.k<=3 ? regColor(n.r) : 'rgba(11,18,21,.85)';
      ctx.fill();
      ctx.lineWidth = hit?2.2:1.1;
      ctx.strokeStyle = hit?'#ece6d6':(n.k<=3?'rgba(11,18,21,.75)':regColor(n.r));
      ctx.stroke();
      var show=false;
      if(labelMode==='all') show=true;
      else if(labelMode!=='none'){
        if(hit) show=true;
        else if(n.k===3) show=true;
        else if(n.k===2) show=z>0.42;
        else if(n.k===1) show=z>0.85;
        else if(n.k===0) show=z>1.5;
        else show=z>3.2;
      }
      if(show){
        ctx.font=(n.k===3?13:n.k===2?12:11)+'px "Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.lineWidth=3; ctx.strokeStyle='rgba(6,10,12,.92)';
        ctx.strokeText(n.n,X,Y-s-2);
        ctx.fillStyle=dim?'rgba(236,230,214,.4)':'#ece6d6';
        ctx.fillText(n.n,X,Y-s-2);
      }
    });
    ctx.globalAlpha=1;
    $('cnt').textContent = shown+' / '+D.nodes.length+'곳'
      + (query?' · 일치 '+D.nodes.filter(matched).length:'')
      + ' · '+view.s.toFixed(2)+'×';
  }
  function fit(){
    var r=resize();
    var s=Math.min(r.width/MW, r.height/MH)*0.98;
    view.s=s; view.tx=(r.width-MW*s)/2; view.ty=(r.height-MH*s)/2;
    draw();
  }
  function zoomAt(cx,cy,f){
    var ns=Math.max(0.12,Math.min(24,view.s*f)); f=ns/view.s;
    view.tx=cx-(cx-view.tx)*f; view.ty=cy-(cy-view.ty)*f; view.s=ns; draw();
  }
  function centerOn(n,s){
    view.s = s || Math.max(view.s,3);
    view.tx = window.innerWidth/2 - n.x*view.s;
    view.ty = window.innerHeight/2 - (MH-1-n.y)*view.s;
    draw();
  }
  function pick(mx,my){
    var best=null,bd=1e9;
    D.nodes.forEach(function(n){
      if(!visible(n)) return;
      var dx=sx(n.x)+view.s/2-mx, dy=sy(n.y)+view.s/2-my, d=dx*dx+dy*dy;
      var rad=Math.max(KSIZE[n.k]+4,7);
      if(d<rad*rad && d<bd){ bd=d; best=n; }
    });
    return best;
  }

  var drag=null;
  cv.addEventListener('pointerdown',function(e){
    drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};
    cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',function(e){
    if(drag){
      view.tx=drag.tx+(e.clientX-drag.x); view.ty=drag.ty+(e.clientY-drag.y);
      if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4) drag.moved=true;
      draw(); return;
    }
    var n=pick(e.clientX,e.clientY);
    if(n){
      tip.style.display='block';
      tip.style.left=Math.min(window.innerWidth-260,e.clientX+14)+'px';
      tip.style.top=Math.max(4,e.clientY-10)+'px';
      tip.innerHTML='<b>'+esc(n.n)+'</b>'+esc(KIND[n.k])+(n.lv?' · Lv.'+n.lv:'')
        +'<div class="kv">'+esc(D.counties[n.c]||'-')+' · '+esc(D.regions[n.r]||'-')+'</div>'
        +'<div class="kv">좌표 '+n.x+' · '+n.y+'</div>';
    } else tip.style.display='none';
  });
  cv.addEventListener('pointerup',function(e){
    if(drag&&!drag.moved){
      var n=pick(e.clientX,e.clientY), t=tileAt(e.clientX,e.clientY), box=$('tile');
      if(n){
        if(navigator.clipboard) navigator.clipboard.writeText(n.n+' '+n.x+'·'+n.y);
        box.innerHTML='<b>'+esc(n.n)+'</b>'+esc(KIND[n.k])+(n.lv?' · Lv.'+n.lv:'')
          +'<div class="kv">'+esc(D.counties[n.c]||'-')+' · '+esc(D.regions[n.r]||'-')+'</div>'
          +'<div class="kv">좌표 '+n.x+' · '+n.y+' (복사됨)</div>';
      } else if(t.x>=0&&t.y>=0&&t.x<MW&&t.y<MH){
        var code=codeAt?codeAt(t.x,t.y):null;
        var nm=(code!=null&&T.names[code])?T.names[code]:'평지';
        box.innerHTML='<b>'+esc(nm)+'</b><div class="kv">좌표 '+t.x+' · '+t.y+'</div>';
      }
    }
    drag=null; cv.classList.remove('drag');
  });
  cv.addEventListener('pointercancel',function(){ drag=null; cv.classList.remove('drag'); });
  cv.addEventListener('pointerleave',function(){ tip.style.display='none'; });
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    zoomAt(e.clientX,e.clientY,e.deltaY<0?1.2:1/1.2);
  },{passive:false});
  $('zin').addEventListener('click',function(){ zoomAt(innerWidth/2,innerHeight/2,1.4); });
  $('zout').addEventListener('click',function(){ zoomAt(innerWidth/2,innerHeight/2,1/1.4); });
  $('fit').addEventListener('click',fit);

  KIND.forEach(function(k,i){
    var b=document.createElement('button');
    b.type='button'; b.className='on';
    b.innerHTML='<i style="color:'+(i<=3?'#cca85a':'#7aa7dd')+'"></i>'+k
      +' <span style="color:var(--faint);font-family:var(--mono);font-size:10px">'
      +D.nodes.filter(function(n){return n.k===i;}).length+'</span>';
    b.addEventListener('click',function(){
      kindOn[i]=!kindOn[i]; b.classList.toggle('on',kindOn[i]); draw(); renderList();
    });
    $('kinds').appendChild(b);
  });
  [['0','평지'],['3','산맥'],['2','강물'],['7','관로'],['9','성벽'],['11','성지']].forEach(function(p){
    var s=document.createElement('span');
    s.innerHTML='<i style="background:'+(T.palette[p[0]]||'#4a543f')+'"></i>'+p[1];
    $('terrainKey').appendChild(s);
  });
  regIds.forEach(function(r){
    var o=document.createElement('option'); o.value=r; o.textContent=D.regions[r];
    $('region').appendChild(o);
  });
  $('region').addEventListener('change',function(){ regionSel=this.value; draw(); renderList(); });
  $('label').addEventListener('change',function(){ labelMode=this.value; draw(); });
  $('q').addEventListener('input',function(){
    query=norm(this.value);
    var hits=D.nodes.filter(matched);
    if(query&&hits.length&&hits.length<=6) centerOn(hits[0]); else draw();
  });

  var lp=$('list');
  $('listBtn').addEventListener('click',function(){
    lp.classList.toggle('open'); this.classList.toggle('on',lp.classList.contains('open'));
  });
  $('listClose').addEventListener('click',function(){
    lp.classList.remove('open'); $('listBtn').classList.remove('on');
  });
  function renderList(){
    var km=$('listKind').value, sort=$('listSort').value;
    var rows=D.nodes.filter(function(n){
      if(km!=='all'&&n.k>3) return false;
      return visible(n);
    });
    if(sort==='lv') rows.sort(function(a,b){ return b.lv-a.lv||a.n.localeCompare(b.n,'ko'); });
    else if(sort==='name') rows.sort(function(a,b){ return a.n.localeCompare(b.n,'ko'); });
    else rows.sort(function(a,b){ return a.r-b.r||a.c-b.c||b.lv-a.lv; });
    var h='';
    rows.forEach(function(n){
      h+='<div class="it" data-i="'+D.nodes.indexOf(n)+'"><span class="nm">'+esc(n.n)+'</span>'
        +'<span class="lv">'+(n.lv?'Lv.'+n.lv:'')+'</span>'
        +'<span class="meta">'+esc(D.regions[n.r]||'')+' · '+n.x+'·'+n.y+'</span></div>';
    });
    $('listBody').innerHTML=h||'<div class="it" style="color:var(--faint)">조건에 맞는 지점이 없다.</div>';
  }
  $('listBody').addEventListener('click',function(e){
    var it=e.target.closest?e.target.closest('.it[data-i]'):null;
    if(!it) return;
    centerOn(D.nodes[+it.getAttribute('data-i')],4);
  });
  $('listKind').addEventListener('change',renderList);
  $('listSort').addEventListener('change',renderList);

  renderList();
  window.addEventListener('resize',function(){ if(ready){ resize(); draw(); } });
})();
</script>
</body>
</html>
